name: Export SSUF research snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-ssuf-research.yml

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Record snapshot identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ssuf-export
          git rev-parse HEAD > /tmp/ssuf-export/COMMIT_SHA.txt
          git status --porcelain=v1 > /tmp/ssuf-export/WORKTREE_STATUS.txt
          test ! -s /tmp/ssuf-export/WORKTREE_STATUS.txt

      - name: Upload research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ssuf-research-snapshot
          path: |
            research/unequal_cost_fixed_topology
            /tmp/ssuf-export/COMMIT_SHA.txt
            /tmp/ssuf-export/WORKTREE_STATUS.txt
          if-no-files-found: error
          retention-days: 1
