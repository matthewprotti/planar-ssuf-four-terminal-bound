name: Apply SSUF adversarial revision

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-ssuf-adversarial-revision.yml
      - .research-revision/**

permissions:
  contents: write

concurrency:
  group: apply-ssuf-adversarial-revision
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Verify and extract the revision payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .research-revision -maxdepth 1 -name 'ssuf.part-*' | wc -l)" -eq 2
          cat .research-revision/ssuf.part-* > /tmp/ssuf-revision.b64
          echo "a33c83e9f78807c07a716bfc1a5dc2ee3c30b693de551a179e7e64142154d6e4  /tmp/ssuf-revision.b64" | sha256sum --check --strict
          base64 --decode /tmp/ssuf-revision.b64 > /tmp/ssuf-revision.tar.gz
          echo "7170a98acb5763e3190fcb82c3f3101567a84287845604c2d54245954a9873a6  /tmp/ssuf-revision.tar.gz" | sha256sum --check --strict
          rm -rf research/unequal_cost_fixed_topology
          mkdir -p research/unequal_cost_fixed_topology
          tar -xzf /tmp/ssuf-revision.tar.gz -C research/unequal_cost_fixed_topology

      - name: Run exact and symbolic validation
        shell: bash
        working-directory: research/unequal_cost_fixed_topology
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet sympy==1.14.0
          python -m py_compile ./*.py
          python threshold_family_census.py
          python independent_census_check.py
          python symbolic_every_pair_check.py
          python validate_artifacts.py
          python build_artifact_manifest.py --check

      - name: Commit the reviewed revision
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .research-revision
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/unequal_cost_fixed_topology .research-revision
          git commit -m "Address unequal-cost SSUF referee findings"
          git push origin HEAD:agent/unequal-cost-fixed-topology-research
