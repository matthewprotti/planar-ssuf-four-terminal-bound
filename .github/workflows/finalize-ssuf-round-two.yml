name: Finalize SSUF round-two replay

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: finalize-ssuf-round-two
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Install pinned symbolic dependencies
        run: python -m pip install -r research/unequal_cost_fixed_topology/requirements-replay.txt

      - name: Build source manifest
        run: python research/unequal_cost_fixed_topology/build_artifact_manifest.py

      - name: Run deterministic replay
        run: python research/unequal_cost_fixed_topology/round2_replay.py

      - name: Commit research-only replay artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-ssuf-round-two.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/unequal_cost_fixed_topology .github/workflows/finalize-ssuf-round-two.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(research/unequal_cost_fixed_topology/|[.]github/workflows/finalize-ssuf-round-two[.]yml$)' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }
          git commit -m "Finalize second SSUF referee replay"
          git push origin HEAD:agent/unequal-cost-fixed-topology-research
