name: Export current SSUF research snapshot

on:
  push:
    branches:
      - agent/unequal-cost-fixed-topology-research
    paths:
      - .github/workflows/export-ssuf-current.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current research head
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Record identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ssuf-current
          git rev-parse HEAD > /tmp/ssuf-current/COMMIT_SHA.txt
          git status --porcelain=v1 > /tmp/ssuf-current/WORKTREE_STATUS.txt
          test ! -s /tmp/ssuf-current/WORKTREE_STATUS.txt

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ssuf-current-research-snapshot
          path: |
            research/unequal_cost_fixed_topology
            /tmp/ssuf-current/COMMIT_SHA.txt
            /tmp/ssuf-current/WORKTREE_STATUS.txt
          if-no-files-found: error
          retention-days: 1
