name: Diagnose SSUF forward replay

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-ssuf-forward.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Apply patch and collect replay diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/ssuf-diagnostics.txt) 2>&1
          echo "HEAD=$(git rev-parse HEAD)"
          python --version
          python -m pip --version
          python -m pip show sympy mpmath || true
          cat .forward-revision/ssuf.part-00 .forward-revision/ssuf.part-01 > /tmp/ssuf-forward.b64
          sha256sum /tmp/ssuf-forward.b64
          base64 --decode /tmp/ssuf-forward.b64 > /tmp/ssuf-forward.patch.gz
          echo "BASE64_EXIT=$?"
          sha256sum /tmp/ssuf-forward.patch.gz
          gzip -t /tmp/ssuf-forward.patch.gz
          echo "GZIP_TEST_EXIT=$?"
          gzip -dc /tmp/ssuf-forward.patch.gz > /tmp/ssuf-forward.patch
          git apply --check -p2 /tmp/ssuf-forward.patch
          echo "GIT_APPLY_CHECK_EXIT=$?"
          git apply -p2 /tmp/ssuf-forward.patch
          echo "GIT_APPLY_EXIT=$?"
          cd research/unequal_cost_fixed_topology
          python round2_replay.py
          echo "REPLAY_EXIT=$?"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssuf-forward-replay-diagnostics
          path: |
            /tmp/ssuf-diagnostics.txt
            /tmp/ssuf-forward.patch
          if-no-files-found: warn
          retention-days: 1
