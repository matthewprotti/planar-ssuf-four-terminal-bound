name: Diagnose SSUF forward transport

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-ssuf-forward.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Collect transport diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/ssuf-diagnostics.txt) 2>&1
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PARTS"
          find .forward-revision -maxdepth 1 -type f -name 'ssuf.part-*' -print | sort
          echo "COUNTS"
          find .forward-revision -maxdepth 1 -type f -name 'ssuf.part-*' | wc -l
          wc -c .forward-revision/ssuf.part-* || true
          sha256sum .forward-revision/ssuf.part-* || true
          cat .forward-revision/ssuf.part-* > /tmp/ssuf-forward.b64
          echo "CONCAT"
          wc -c /tmp/ssuf-forward.b64
          sha256sum /tmp/ssuf-forward.b64
          base64 --decode /tmp/ssuf-forward.b64 > /tmp/ssuf-forward.patch.gz
          echo "BASE64_EXIT=$?"
          wc -c /tmp/ssuf-forward.patch.gz
          sha256sum /tmp/ssuf-forward.patch.gz
          gzip -t /tmp/ssuf-forward.patch.gz
          echo "GZIP_TEST_EXIT=$?"
          gzip -dc /tmp/ssuf-forward.patch.gz > /tmp/ssuf-forward.patch
          echo "GZIP_DECODE_EXIT=$?"
          wc -c /tmp/ssuf-forward.patch
          sha256sum /tmp/ssuf-forward.patch
          git apply --check /tmp/ssuf-forward.patch
          echo "GIT_APPLY_CHECK_EXIT=$?"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssuf-forward-diagnostics
          path: |
            /tmp/ssuf-diagnostics.txt
            /tmp/ssuf-forward.b64
            /tmp/ssuf-forward.patch.gz
            /tmp/ssuf-forward.patch
          if-no-files-found: warn
          retention-days: 1
