name: Apply SSUF forward limits

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-ssuf-forward-limits.yml
      - .forward-revision/**

permissions:
  contents: write

concurrency:
  group: apply-ssuf-forward-limits
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .forward-revision -maxdepth 1 -name 'ssuf.part-*' | wc -l)" -eq 3
          cat .forward-revision/ssuf.part-* > /tmp/ssuf-forward.b64
          echo "fa0db9262af6c3062b2ea03b91efd4ff51734a77f45bb8a6326f309bddf96d4b  /tmp/ssuf-forward.b64" | sha256sum --check --strict
          base64 --decode /tmp/ssuf-forward.b64 > /tmp/ssuf-forward.patch.gz
          echo "5ec091491a6b852f466b3e2ea856db0a643adf8654d902000d8d15579af5b76e  /tmp/ssuf-forward.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/ssuf-forward.patch.gz > /tmp/ssuf-forward.patch
          git apply --check /tmp/ssuf-forward.patch
          git apply /tmp/ssuf-forward.patch

      - name: Run complete offline replay
        shell: bash
        working-directory: research/unequal_cost_fixed_topology
        run: |
          set -euo pipefail
          python round2_replay.py

      - name: Commit research-only revision
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .forward-revision
          rm -f .github/workflows/apply-ssuf-forward-limits.yml
          rm -f .github/workflows/export-ssuf-research.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/unequal_cost_fixed_topology .forward-revision .github/workflows/apply-ssuf-forward-limits.yml .github/workflows/export-ssuf-research.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(research/unequal_cost_fixed_topology/|[.]forward-revision/|[.]github/workflows/apply-ssuf-forward-limits[.]yml$|[.]github/workflows/export-ssuf-research[.]yml$)' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }
          git commit -m "Advance SSUF cell and signed-cost research"
          git push origin HEAD:agent/unequal-cost-fixed-topology-research
