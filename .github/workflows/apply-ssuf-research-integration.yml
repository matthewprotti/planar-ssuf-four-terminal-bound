name: Apply SSUF research integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-ssuf-research-integration.yml
      - .research-integrate-ssuf/**

permissions:
  contents: write

concurrency:
  group: apply-ssuf-research-integration
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/unequal-cost-fixed-topology-research'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          ref: agent/unequal-cost-fixed-topology-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned replay dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r research/unequal_cost_fixed_topology/requirements-replay.txt

      - name: Verify and apply the research patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .research-integrate-ssuf -maxdepth 1 -name 'part-*' | wc -l)" -eq 10
          : > /tmp/ssuf.patch.b64
          for part in .research-integrate-ssuf/part-*; do
            tr -d '\r\n' < "$part" >> /tmp/ssuf.patch.b64
          done
          echo "90c9bac7a369a35e816e0de4050eeeb9fb01673ecec6c93a8784e2be9fd11a56  /tmp/ssuf.patch.b64" | sha256sum --check --strict
          base64 --decode /tmp/ssuf.patch.b64 > /tmp/ssuf.patch.xz
          echo "4fa6435dbf9cad4a575ba5161c8d2f12bff1a06c26ba6fea6ed7739cf954ffec  /tmp/ssuf.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/ssuf.patch.xz > /tmp/ssuf.patch
          git apply --check /tmp/ssuf.patch
          git apply /tmp/ssuf.patch

      - name: Run the complete deterministic SSUF replay
        shell: bash
        working-directory: research/unequal_cost_fixed_topology
        run: |
          set -euo pipefail
          python round2_replay.py

      - name: Commit the research-only integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .research-integrate-ssuf
          rm -rf .research-advance
          rm -f .github/workflows/apply-ssuf-research-integration.yml
          rm -f .github/workflows/export-ssuf-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/unequal_cost_fixed_topology \
            .research-integrate-ssuf \
            .research-advance \
            .github/workflows/apply-ssuf-research-integration.yml \
            .github/workflows/export-ssuf-current.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(research/unequal_cost_fixed_topology/|[.]research-integrate-ssuf/|[.]research-advance/|[.]github/workflows/(apply-ssuf-research-integration|export-ssuf-current)[.]yml$)' || true)"
          test -z "$unexpected" || { echo "unexpected staged paths:"; echo "$unexpected"; exit 1; }
          git commit -m "Advance SSUF positive-cell classification"
          git push origin HEAD:agent/unequal-cost-fixed-topology-research
